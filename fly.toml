# Fly.io deployment. One machine, one volume, one public port: the pages.
#
# The service opens connections out -- to the feeds, to Telegram, and through
# Claude Code to Anthropic. Since 2026-10-01 it also serves the pages its
# summaries link to, and that is all it answers: GET /r/<random id> for a page
# on the volume, "not found" for anything else. No listing, no commands, no
# writes; the bot still takes commands from the owner's chat alone.
#
# Secrets, set with `fly secrets set` or scripts/fly-deploy.sh, never here:
#   TELEGRAM_BOT_TOKEN       from @BotFather
#   CLAUDE_CODE_OAUTH_TOKEN  from `claude setup-token` on your own machine
#   TELEGRAM_CHAT_ID         the chat the brief goes to, and the only one the
#                            bot will answer
#   TELEGRAM_CHANNEL_ID      optional: a channel the brief is also posted to
#   USER_AGENT               "Market Watch you@example.com"; the SEC requires it
#   FRED_API_KEY             market levels
#   FINNHUB_API_KEY          share prices and company news
#   TAVILY_API_KEY           news found by searching, beside the feeds
#   MASSIVE_API_KEY          the whole US market's daily bars, two years of
#                            which the closer look keeps in /data/market

app = "joseph-market-watch"
primary_region = "sin"   # Singapore: nearest to the reader, and the feeds are worldwide anyway

[build]
  dockerfile = "Dockerfile"

[env]
  DATA_DIR = "/data"
  SCHEDULE_TZ = "America/New_York"
  REPORT_AT = "07:30"
  DISPLAY_TZ = "Asia/Singapore"
  SKIP_WEEKENDS = "true"
  SOURCE_LINKS = "off"
  REPLACE_PREVIOUS = "true"
  MAX_ARTICLES = "600"
  TRIAGE = "true"
  DISCOVER = "true"

  # Long messages go out as a summary with a button to this page server.
  # Remove PAGES_URL to send everything in full again.
  PAGES_URL = "https://joseph-market-watch.fly.dev"
  PAGES_ADDR = ":8080"

  # Every model call is answered by Claude Code on this machine, by Opus 5.5
  # for every stage. Two batches at a time.
  RELAY_ANSWER = "claude"
  RELAY_CONCURRENCY = "2"

# prefs.yaml (the chat, and the watchlist and feed changes made from Telegram),
# the covered-story record, the candidate names, the run history, and every
# run's requests and replies. Without this the chat id is lost on every deploy
# and the brief has nowhere to go. scripts/sync-from-fly.sh copies it down.
[mounts]
  source = "market_watch_data"
  destination = "/data"

[[vm]]
  size = "shared-cpu-1x"
  # One headless Claude Code call peaked at 250MB, measured on a real sorting
  # batch. Two at once, plus the service and a large filer's XBRL file for
  # /analyse, fit in a gigabyte with room left over.
  memory = "1gb"

# The pages, over HTTPS on Fly's certificate for joseph-market-watch.fly.dev.
#
# The machine runs a scheduler, so it must never be stopped for being idle: a
# stopped machine has no timer, and the brief would simply never fire. Fly's
# proxy stops idle machines of an app with a web service unless told not to,
# which auto_stop_machines and min_machines_running do here.
[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
