# The companies you follow, by sector. The sectors themselves, and what each
# covers, are in sectors.yaml.
#
# This is the one list the whole service reads: the prices at the start of a
# brief and the searches for shares that moved, the SEC filings, the line of
# biggest moves under each section, the matching of articles by name and
# ticker, and the checks that keep a followed company out of "new names" and
# the closer look.
#
#   symbol  the US ticker. Leave it out for a company with none -- private, or
#           listed only abroad: it is still matched by name, and has no price.
#   name    how a headline writes it: "Nvidia", not "NVIDIA Corporation". It is
#           also what the searches for it ask about.
#   also    other names it goes by, matched the same way.
#   match   "ticker" where the name is an ordinary word that would match
#           ordinary prose, "name" where the ticker is. Left out, both count.
#
# Names match case-blind on word boundaries, and a hyphen is a boundary: "UPS"
# as a name matched every "start-ups". Tickers match as capitals standing
# alone, and a one-letter ticker (C, F, V) only when written as one, "$C" or
# "(NYSE: C)", since bare it matches "C-suite" and "F-150".
#
# /watchlist add and remove change the list from Telegram without a deploy.
# Those edits are kept on Fly's disk, on top of this file, and
# scripts/sync-from-fly.sh writes them in here (docs/RUNBOOK.md, "Changing the
# watchlist").

