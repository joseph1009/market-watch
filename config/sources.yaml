# The news feeds polled for every brief.
#
#   weight   ranks feeds against each other, 1 to 10: when several carry the
#            same story, the heaviest keeps it, and it counts toward what
#            survives the cut. Primary agency releases outrank wire coverage,
#            which outranks aggregators and commentary.
#   enabled  false keeps a feed on the list but unpolled, with the reason
#            beside it, so the next attempt starts from what is already known.
#
# /sources on|off <id> switches a feed from Telegram without a deploy. The
# switch is kept on Fly's disk, on top of this file, and
# scripts/sync-from-fly.sh writes it in here (docs/RUNBOOK.md, "Changing the
# watchlist").
#
# Every address was checked against the live network before it was added.

# --- Filings ------------------------------------------------------------------

# Switched off 2026-09-21: this is every 8-K filed by every filer, about forty a
# day and almost all of them small companies nobody here follows. Across the
# briefs measured it was cited zero times, while the targeted SEC feeds were
# cited repeatedly. Kept so /sources can bring it back if the sorting ever gets
# good enough to use it.
- id: sec-8k
  name: SEC EDGAR 8-K
  url: https://www.sec.gov/cgi-bin/browse-edgar?action=getcurrent&type=8-K&company=&dateb=&owner=include&count=40&output=atom
  weight: 10
  enabled: false
- id: sec-press
  name: SEC Press Releases
  url: https://www.sec.gov/news/pressreleases.rss
  weight: 9
  enabled: true

# --- Monetary policy ----------------------------------------------------------

# Switched off 2026-09-10 in favour of the three narrow Fed feeds below.
# press_all mixes monetary policy with enforcement actions and application
# approvals; the brief read a day of it and wrote "routine enforcement actions
# and application approvals with no market read", which is tokens spent to say
# nothing.
- id: fed-press
  name: Federal Reserve Press Releases
  url: https://www.federalreserve.gov/feeds/press_all.xml
  weight: 10
  enabled: false
- id: fed-monetary
  name: Federal Reserve Monetary Policy
  url: https://www.federalreserve.gov/feeds/press_monetary.xml
  weight: 10
  enabled: true
# Speeches and testimony are where officials say what they think before it
# reaches the wires. The briefs had been quoting Waller and Hammack secondhand
# through CNBC; this is the primary text.
- id: fed-speeches
  name: Federal Reserve Speeches
  url: https://www.federalreserve.gov/feeds/speeches.xml
  weight: 9
  enabled: true
- id: fed-testimony
  name: Federal Reserve Testimony
  url: https://www.federalreserve.gov/feeds/testimony.xml
  weight: 9
  enabled: true

