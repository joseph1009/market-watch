# Singapore's thirty largest listed companies, the Straits Times Index, as
# FTSE Russell listed them in May 2026. The weekly themes measure these beside
# the US market from their prices on the Singapore Exchange, since no source
# covers the whole of that market in one request.
#
# None of them files accounts with the SEC, so a verdict on one is made
# without accounts and is never more than low confidence.
#
# The index is reviewed each quarter. When a company leaves or joins it,
# change it here.
