# what a term means in plain words; the link is for the reader who wants
# more than a few words.
#
# Each entry is a page and the words that lead to it. A word written in
# capitals (EPS, VIX) matches only in capitals, so "eps" inside another word,
# or an ordinary word that happens to share the letters, is left alone; any
# other word matches whatever its case. Every link was checked to open the
# right page when it was added (2026-10-01): check a new one the same way.

